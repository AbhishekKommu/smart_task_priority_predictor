name: Build Flutter Web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android,web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Copy build to site/
        run: |
          rm -rf site && mkdir site
          cp -r build/web/* site/
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: site
